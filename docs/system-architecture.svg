<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040" role="img" aria-labelledby="title desc">
  <title id="title">CoreFlow multi-tenant CRM system architecture</title>
  <desc id="desc">Architecture diagram showing users, Render-hosted Laravel application, authentication and tenant controls, CRM modules, queues, scheduler, Neon PostgreSQL, email, and optional AI services.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071b25"/><stop offset="1" stop-color="#0b2e35"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f766e"/><stop offset="1" stop-color="#14b8a6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#001014" flood-opacity=".28"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#45d7c4"/>
    </marker>
    <style>
      .title{font:700 42px Inter,Segoe UI,sans-serif;fill:#f0fdfa}.subtitle{font:400 18px Inter,Segoe UI,sans-serif;fill:#a7c7ca}
      .section{font:700 16px Inter,Segoe UI,sans-serif;fill:#5eead4;letter-spacing:2px}.boxTitle{font:700 20px Inter,Segoe UI,sans-serif;fill:#ecfeff}
      .boxText{font:400 15px Inter,Segoe UI,sans-serif;fill:#b9d6d9}.small{font:500 13px Inter,Segoe UI,sans-serif;fill:#9fc2c6}
      .flowTitle{font:700 15px Inter,Segoe UI,sans-serif;fill:#062b2d}.flowText{font:500 13px Inter,Segoe UI,sans-serif;fill:#18565a}
      .card{fill:#103640;stroke:#1f5962;stroke-width:1.5}.soft{fill:#0c2b34;stroke:#1d4f58;stroke-width:1.5}.accent{fill:url(#hero);stroke:#5eead4;stroke-width:1.5}
      .line{fill:none;stroke:#45d7c4;stroke-width:3;marker-end:url(#arrow)}.dash{fill:none;stroke:#57aab0;stroke-width:2;stroke-dasharray:8 8;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1600" height="1040" rx="28" fill="url(#bg)"/>
  <circle cx="1450" cy="100" r="210" fill="#14b8a6" opacity=".06"/><circle cx="120" cy="900" r="260" fill="#22d3ee" opacity=".05"/>

  <text x="70" y="72" class="title">CoreFlow CRM · System Architecture</text>
  <text x="70" y="108" class="subtitle">Shared-database multi-tenancy · Laravel 13 · Render · Neon PostgreSQL</text>

  <text x="70" y="160" class="section">ACTORS</text>
  <g filter="url(#shadow)">
    <rect x="70" y="180" width="230" height="105" rx="18" class="card"/>
    <text x="95" y="218" class="boxTitle">Platform Admin</text><text x="95" y="247" class="boxText">Approvals · companies</text><text x="95" y="270" class="boxText">billing · audit logs</text>
    <rect x="70" y="305" width="230" height="105" rx="18" class="card"/>
    <text x="95" y="343" class="boxTitle">Company Admin</text><text x="95" y="372" class="boxText">Team · invitations</text><text x="95" y="395" class="boxText">workspace · billing</text>
    <rect x="70" y="430" width="230" height="105" rx="18" class="card"/>
    <text x="95" y="468" class="boxTitle">Manager / Staff</text><text x="95" y="497" class="boxText">Contacts · pipeline</text><text x="95" y="520" class="boxText">tasks · AI drafts</text>
  </g>

  <path d="M300 232 C350 232 350 300 400 300" class="line"/><path d="M300 357 C350 357 350 325 400 325" class="line"/><path d="M300 482 C350 482 350 350 400 350" class="line"/>

  <text x="400" y="160" class="section">APPLICATION · RENDER DOCKER SERVICE</text>
  <g filter="url(#shadow)">
    <rect x="400" y="180" width="750" height="390" rx="24" class="soft"/>
    <rect x="425" y="205" width="700" height="84" rx="16" class="accent"/>
    <text x="455" y="240" class="boxTitle">HTTPS → Apache → Laravel Router</text>
    <text x="455" y="267" class="boxText">Blade + Bootstrap/Vite interface · secure cookies · production mode</text>

    <rect x="425" y="310" width="210" height="105" rx="16" class="card"/>
    <text x="447" y="344" class="boxTitle">Identity</text><text x="447" y="371" class="boxText">Login · reset · verify</text><text x="447" y="395" class="boxText">active-account checks</text>
    <rect x="657" y="310" width="210" height="105" rx="16" class="card"/>
    <text x="679" y="344" class="boxTitle">Authorization</text><text x="679" y="371" class="boxText">Roles · throttles</text><text x="679" y="395" class="boxText">subscription gates</text>
    <rect x="889" y="310" width="236" height="105" rx="16" class="card"/>
    <text x="911" y="344" class="boxTitle">Tenant Context</text><text x="911" y="371" class="boxText">company_id scoping</text><text x="911" y="395" class="boxText">policies · seat limits</text>

    <rect x="425" y="438" width="160" height="102" rx="16" class="card"/>
    <text x="446" y="472" class="boxTitle">Onboarding</text><text x="446" y="499" class="boxText">Approval</text><text x="446" y="522" class="boxText">Invitations</text>
    <rect x="600" y="438" width="160" height="102" rx="16" class="card"/>
    <text x="621" y="472" class="boxTitle">CRM</text><text x="621" y="499" class="boxText">Contacts · deals</text><text x="621" y="522" class="boxText">Tasks · notes</text>
    <rect x="775" y="438" width="160" height="102" rx="16" class="card"/>
    <text x="796" y="472" class="boxTitle">Billing</text><text x="796" y="499" class="boxText">Plans · invoices</text><text x="796" y="522" class="boxText">Seat controls</text>
    <rect x="950" y="438" width="175" height="102" rx="16" class="card"/>
    <text x="971" y="472" class="boxTitle">AI Assistant</text><text x="971" y="499" class="boxText">Consent · quotas</text><text x="971" y="522" class="boxText">Human approval</text>
  </g>

  <path d="M775 289 L775 309" class="line"/><path d="M635 362 L656 362" class="line"/><path d="M867 362 L888 362" class="line"/>
  <path d="M1007 415 C1007 428 1037 428 1037 437" class="line"/>

  <text x="1210" y="160" class="section">DATA &amp; SERVICES</text>
  <g filter="url(#shadow)">
    <rect x="1210" y="180" width="320" height="140" rx="20" class="accent"/>
    <text x="1240" y="221" class="boxTitle">Neon PostgreSQL</text>
    <text x="1240" y="251" class="boxText">Shared schema · tenant-owned rows</text>
    <text x="1240" y="278" class="boxText">Sessions · cache · queue · CRM</text>
    <text x="1240" y="301" class="small">TLS direct endpoint for migrations</text>
    <rect x="1210" y="345" width="320" height="100" rx="18" class="card"/>
    <text x="1240" y="383" class="boxTitle">Email Transport</text><text x="1240" y="412" class="boxText">Verification · invitations · reminders</text>
    <rect x="1210" y="470" width="320" height="100" rx="18" class="card"/>
    <text x="1240" y="508" class="boxTitle">Optional OpenAI API</text><text x="1240" y="537" class="boxText">Summaries and follow-up drafts</text>
  </g>
  <path d="M1150 370 C1180 370 1180 250 1209 250" class="line"/>
  <path d="M1150 475 C1180 475 1180 395 1209 395" class="dash"/>
  <path d="M1125 490 C1175 490 1175 520 1209 520" class="dash"/>

  <text x="400" y="630" class="section">BACKGROUND PROCESSING</text>
  <g filter="url(#shadow)">
    <rect x="400" y="650" width="350" height="112" rx="18" class="card"/>
    <text x="427" y="689" class="boxTitle">Laravel Scheduler</text><text x="427" y="718" class="boxText">Hourly crm:reminders · no overlap</text><text x="427" y="744" class="small">Claims due tasks before dispatch</text>
    <rect x="800" y="650" width="350" height="112" rx="18" class="card"/>
    <text x="827" y="689" class="boxTitle">Database Queue Worker</text><text x="827" y="718" class="boxText">SendTaskReminder · retries · backoff</text><text x="827" y="744" class="small">Runs alongside the web process</text>
  </g>
  <path d="M750 706 L799 706" class="line"/><path d="M1150 706 C1230 706 1230 445 1370 445" class="dash"/>

  <text x="70" y="835" class="section">PRIMARY USER FLOW</text>
  <g filter="url(#shadow)">
    <rect x="70" y="860" width="200" height="105" rx="18" fill="#dffbf6"/><text x="95" y="897" class="flowTitle">1 · Register</text><text x="95" y="925" class="flowText">Company request</text><text x="95" y="947" class="flowText">enters review</text>
    <rect x="320" y="860" width="200" height="105" rx="18" fill="#dffbf6"/><text x="345" y="897" class="flowTitle">2 · Approve</text><text x="345" y="925" class="flowText">Company + owner</text><text x="345" y="947" class="flowText">workspace created</text>
    <rect x="570" y="860" width="200" height="105" rx="18" fill="#dffbf6"/><text x="595" y="897" class="flowTitle">3 · Invite Team</text><text x="595" y="925" class="flowText">Expiring link</text><text x="595" y="947" class="flowText">assigns tenant + role</text>
    <rect x="820" y="860" width="200" height="105" rx="18" fill="#dffbf6"/><text x="845" y="897" class="flowTitle">4 · Run CRM</text><text x="845" y="925" class="flowText">Contacts → deals</text><text x="845" y="947" class="flowText">→ tasks → reminders</text>
    <rect x="1070" y="860" width="200" height="105" rx="18" fill="#dffbf6"/><text x="1095" y="897" class="flowTitle">5 · Manage Plan</text><text x="1095" y="925" class="flowText">Invoice verification</text><text x="1095" y="947" class="flowText">controls access + seats</text>
    <rect x="1320" y="860" width="210" height="105" rx="18" fill="#dffbf6"/><text x="1345" y="897" class="flowTitle">6 · Audit &amp; Export</text><text x="1345" y="925" class="flowText">Activity history</text><text x="1345" y="947" class="flowText">CSV/workspace export</text>
  </g>
  <path d="M270 912 L319 912" class="line"/><path d="M520 912 L569 912" class="line"/><path d="M770 912 L819 912" class="line"/><path d="M1020 912 L1069 912" class="line"/><path d="M1270 912 L1319 912" class="line"/>
  <text x="70" y="1010" class="small">Tenant isolation rule: every company-owned query is scoped to the authenticated user’s company_id before records are read or changed.</text>
</svg>
